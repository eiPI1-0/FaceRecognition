# FaceRecognition configuration -- generated by `main --dump-config`
# Load with `--config <path>`, override with `--set key=value`.
# Unknown keys are rejected with the nearest valid ones.

# --- paths ---
# relative asset paths below resolve against this. Default: the working directory. `paths.root: .` inside a config file anchors the assets next to that file, which lets the binary run from any cwd.
# relative paths resolve against paths.root (default: cwd)
paths.detector_model: models/yunet_120x160.onnx
paths.embedder_model: models/mobilefacenet.onnx
# one subfolder per enrolled person
paths.data_dir: data/

# --- model contract ---
# MODEL CONTRACT: only change together with the model file.
detector.input_w: 160
# the prior grid (strides 8/16/32/64) is derived from these; if the model's anchor count disagrees, PriorBox::decode stops with a message
detector.input_h: 120
# the aligned crop is warped to exactly this size (ArcFace reference template scaled to it), so the model must be trained on that crop
embedder.input_w: 112
embedder.input_h: 112

# --- detection ---
# face is kept above this detector confidence
detector.conf_thresh: 0.60
detector.nms_thresh: 0.30
detector.keep_top_k: 750

# --- model contract ---
# fused head only: box+landmark tensor, 14 floats per anchor ('loc')
detector.out_loc: loc
# 2-class score tensor ('conf')
detector.out_conf: conf
# fused head only: objectness tensor ('iou'). A per-level head (cls_8/obj_8/bbox_8/kps_8...) is detected from the model's own layer names and decoded automatically - these three keys do not apply to it
detector.out_iou: iou

# --- recognition ---
# cosine above which a match is reported; after the alignment fix same-identity sits near 1.0 and cross-identity near 0
recognize.thresh: 0.20

# --- display ---
# display frame = detector input x rfactor; letterbox canvas, and the scale draw()/putText() map detection coords by
display.rfactor: 6

# --- tracking ---
# IoU above which a detection is the same track
tracker.iou: 0.45
# measured: detection 0.93 ms vs embedding 4.47 ms/face, so raising this saves little (max box error 5.9px at 1, ~18px at 5)
tracker.detect_every: 1
# frames a track survives without a matching detection
tracker.max_lost: 15
tracker.min_hits: 1

# --- backend ---
# cpu | cuda | openvino (cuda/openvino need an OpenCV build with them)
dnn.backend: cpu
# 0 = auto by backend (batch is a regression on the OpenCV CPU backend), 1 = force batch, -1 = force one-at-a-time
dnn.batch_mode: 0
