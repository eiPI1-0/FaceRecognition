# nginx reverse proxy snippet for facerec.
# Include inside an existing http {} block, or as /etc/nginx/conf.d/facerec.conf.
#
# Design: nginx handles TLS termination, connection limits, and /metrics protection.
# The upstream is the SO_REUSEPORT port where N facerec processes listen.
# nginx does NOT do load balancing across multiple ports — the kernel already
# distributes connections via SO_REUSEPORT, so a single upstream address suffices.

upstream facerec_backend {
    # All --reuseport instances listen on 127.0.0.1:8080.
    # The kernel distributes connections; no need for multiple server lines.
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl http2;
    server_name facerec.example.com;

    ssl_certificate     /etc/ssl/facerec/cert.pem;
    ssl_certificate_key /etc/ssl/facerec/key.pem;

    # Request body limit (matches --max-request-mb default of 32MB).
    client_max_body_size 32m;

    # Connection timeout to backend. Identify can take ~50ms p99 under load;
    # 10s gives generous headroom without holding connections forever.
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # --- Public API ---
    location /v1/ {
        proxy_pass http://facerec_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable Nagle on the proxy→backend leg too (nginx does this by default
        # with TCP_NODELAY on, but be explicit).
        tcp_nodelay on;
    }

    # --- Health probes (no auth, used by orchestrators) ---
    location = /healthz {
        proxy_pass http://facerec_backend;
    }
    location = /readyz {
        proxy_pass http://facerec_backend;
    }

    # --- Metrics: restrict to internal network ---
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.0/8;
        deny all;

        proxy_pass http://facerec_backend;
    }

    # --- MCP endpoint (for LLM tool calling over HTTP) ---
    location = /mcp {
        proxy_pass http://facerec_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block everything else.
    location / {
        return 404;
    }
}
